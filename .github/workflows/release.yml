name: Publish downloadable server
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify service recovery
        run: dotnet run --project src/ServiceTests/NightStud.ServiceTests.csproj -c Release -- work/release-service src/Server/bin/Release/net10.0/NightStud.Server.dll
      - name: Account numbers and durable player marketplace
        run: dotnet run --project src/PhoneMarketTests/NightStud.PhoneMarketTests.csproj -c Release -- work/phone-market-test
      - name: Real WebSocket phone, market and restart integration
        env:
          RUNNER_DOTNET: dotnet
        run: dotnet run --project src/PhoneMarketTcpTests/NightStud.PhoneMarketTcpTests.csproj -c Release -- work/phone-market-tcp-test src/Server/bin/Release/net10.0/NightStud.Server.dll
      - name: Build portable downloads
        run: python3 scripts/package.py --output release
      - name: Verify Simpfun start.sh-only install and update
        run: python3 scripts/test-start-entry.py --release release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "可能是赌的服务端 $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
